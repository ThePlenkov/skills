schema_version = "1.3"

[task]
name = "devin/skillmaker-create-skill"
description = "Create a new agent skill following repository conventions."
authors = [{ name = "devin-skills-bench" }]
keywords = ["skills", "skillmaker", "frontmatter"]

[metadata]
difficulty = "easy"
category = "agent-skills"

[verifier]
timeout_sec = 300.0

[agent]
timeout_sec = 600.0

[environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"
cpus = 1
memory_mb = 2048
storage_mb = 5120
gpus = 0
mcp_servers = []

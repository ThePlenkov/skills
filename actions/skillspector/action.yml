name: SkillSpector scan
description: >-
  Run SkillSpector on every skill in a path and emit GitHub PR annotations,
  an optional SARIF file, and structured step outputs.

author: ThePlenkov

branding:
  icon: shield
  color: red


inputs:
  path:
    description: >-
      Path to scan. The plugin discovers every `SKILL.md` beneath this
      path and infers a `scan` target per skill. Default: the host
      repo's standard `.agents/skills/` directory.
    required: false
    default: .agents/skills
  baseline:
    description: >-
      Path to a `.skillspector-baseline.yaml` file passed as
      `--baseline`. Leave empty to skip.
    required: false
    default: ""
  no-llm:
    description: "Pass `--no-llm` to skillspector (disables LLM meta-analysis)."
    required: false
    default: "true"
  annotations:
    description: >-
      Emit GitHub Actions workflow commands for inline PR annotations.
      Set to "false" to suppress annotations but still write SARIF.
    required: false
    default: "true"
  sarif:
    description: >-
      Path to write a SARIF 2.1.0 report. Leave empty to skip.
    required: false
    default: ""
  fail-on-error:
    description: >-
      When "true" (default), the action exits with code 1 if any
      error-severity (HIGH/CRITICAL) finding is emitted.
    required: false
    default: "true"
  job-summary:
    description: >-
      When "true", append a markdown summary to `$GITHUB_STEP_SUMMARY`.
    required: false
    default: "true"
  skillspector-version:
    description: "Pinned SkillSpector commit SHA for reproducibility."
    required: false
    default: "78be329a7ea9749842e335598132ce171b8717d4"
  parallelism:
    description: >-
      Max concurrent skill scans. Empty = `nproc` (runner CPU count).
    required: false
    default: ""
  affected:
    description: >-
      When "true" (default), use `nx affected` to scan only skills
      whose files have changed since the base SHA. Requires
      `nx-set-shas` to have populated `NX_BASE` / `NX_HEAD`.
    required: false
    default: "true"
  base-branch:
    description: >-
      Branch name used by `nx-set-shas` for `nx affected`.
    required: false
    default: "main"


outputs:
  sarif-path:
    description: "Absolute path to the SARIF file, if `sarif` input was set."
    value: ${{ steps.scan.outputs.sarif-path }}
  error-count:
    description: "Total error-severity findings across all scanned skills."
    value: ${{ steps.scan.outputs.error-count }}
  warning-count:
    description: "Total warning-severity findings across all scanned skills."
    value: ${{ steps.scan.outputs.warning-count }}
  total-count:
    description: "Total findings across all scanned skills."
    value: ${{ steps.scan.outputs.total-count }}


runs:
  using: composite
  steps:

    - uses: actions/checkout@v7

    - name: Set up Node (LTS)
      uses: actions/setup-node@v6
      with:
        node-version: "lts/*"
        cache: "npm"
        cache-dependency-path: "actions/skillspector/package-lock.json"

    - name: Install action dependencies
      shell: bash
      run: |
        set -euo pipefail
        npm ci --prefix "$GITHUB_ACTION_PATH" --no-audit --no-fund

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install SkillSpector
      shell: bash
      run: pip install --quiet "git+https://github.com/NVIDIA/skillspector.git@${{ inputs.skillspector-version }}"

    - name: Set Nx SHAs
      if: inputs.affected == 'true'
      uses: nrwl/nx-set-shas@v5
      with:
        main-branch-name: ${{ inputs.base-branch }}
        workflow-id: skill-scan.yml

    # Cache Nx's default .nx/cache directory in the host repo.
    # Key: package-lock.json hash + SKILL.md hash + runner.os.
    # Falling back via restore-keys keeps prior plugin versions
    # usable after a dep upgrade.
    - name: Restore Nx cache
      id: nx-cache
      uses: actions/cache/restore@v4
      with:
        path: .nx/cache
        key: nx-skillspector-${{ runner.os }}-${{ hashFiles('actions/skillspector/package-lock.json', '.agents/skills/**/SKILL.md') }}
        restore-keys: |
          nx-skillspector-${{ runner.os }}-

    # Stage the action's nx.json into the host repo for the duration
    # of the scan. If the host already has an nx.json, save it and
    # restore on exit (trap). If we created it, delete on exit.
    #
    # This is the standard pattern for ad-hoc Nx plugin usage in a
    # repo that doesn't normally use Nx — no `cd`, no tmp dir, no
    # symlinks. Nx reads `./nx.json` from cwd (= `$GITHUB_WORKSPACE`).
    - name: Run SkillSpector scan
      id: scan
      shell: bash
      env:
        GITHUB_OUTPUT: ${{ github.output }}
        GITHUB_STEP_SUMMARY: ${{ github.summary }}
        # Make the action's bundled plugin resolvable from cwd.
        NODE_PATH: ${{ github.action_path }}/node_modules
        SKILLSPECTOR_BASELINE: ${{ inputs.baseline }}
        SKILLSPECTOR_NO_LLM: ${{ inputs.no-llm }}
        SARIF_OUT: ${{ inputs.sarif }}
        ANNOTATIONS_ENABLED: ${{ inputs.annotations }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        JOB_SUMMARY_ENABLED: ${{ inputs.job-summary }}
      run: |
        set -euo pipefail

        # Put the action's bundled `nx` binary on PATH. `npx nx` resolves
        # via `node_modules/.bin` of the cwd, which here is the host
        # repo (no `node_modules`). Without this, npx would fetch a
        # fresh copy from npm — which has no `@theplenkov/nx-skillspector`
        # plugin installed and produces an empty project graph
        # ("project runtime-proof not found").
        export PATH="$GITHUB_ACTION_PATH/node_modules/.bin:$PATH"

        # Stage nx.json: save existing (if any), write action's, restore on exit.
        NX_BACKUP=$(mktemp)
        trap 'if [ -s "$NX_BACKUP" ]; then mv "$NX_BACKUP" nx.json; else rm -f nx.json; fi' EXIT
        if [ -f nx.json ]; then
          cp nx.json "$NX_BACKUP"
        fi
        cp "$GITHUB_ACTION_PATH/nx.json" nx.json

        # Ensure .nx is gitignored (idempotent — only adds if missing).
        if [ -f .gitignore ] && ! grep -qxF '.nx' .gitignore; then
          echo '.nx' >> .gitignore
        fi

        # Resolve parallelism.
        if [ -n "${{ inputs.parallelism }}" ]; then
          MAX_WORKERS="${{ inputs.parallelism }}"
        else
          MAX_WORKERS=$(nproc)
        fi

        # Pick `nx affected` or `nx run-many` based on the input.
        if [ "${{ inputs.affected }}" = "true" ]; then
          NX_SUBCMD="affected"
        else
          NX_SUBCMD="run-many"
        fi

        # Pre-flight: ensure the base ref is fetchable so `nx affected`
        # can resolve NX_BASE even on shallow checkouts. Uses the host
        # repo's git dir (we never `cd` away from it).
        if [ "$NX_SUBCMD" = "affected" ]; then
          BASE_REF="${{ inputs.base-branch }}"
          if ! git -C "$GITHUB_WORKSPACE" rev-parse --verify "origin/${BASE_REF}" >/dev/null 2>&1; then
            git -C "$GITHUB_WORKSPACE" fetch --depth=50 origin "${BASE_REF}" 2>/dev/null || true
          fi
          if [ -n "${NX_BASE:-}" ] \
            && ! git -C "$GITHUB_WORKSPACE" cat-file -e "${NX_BASE}" 2>/dev/null; then
            git -C "$GITHUB_WORKSPACE" fetch --depth=200 origin "${NX_BASE}" 2>/dev/null || \
              echo "::warning::fetch of NX_BASE SHA failed; nx affected will likely fail too"
          fi
          if [ -z "${NX_BASE:-}" ]; then
            if NX_BASE=$(git -C "$GITHUB_WORKSPACE" merge-base "origin/${BASE_REF}" HEAD 2>/dev/null) && [ -n "$NX_BASE" ]; then
              echo "nx-set-shas left NX_BASE empty; falling back to merge-base origin/${BASE_REF} → ${NX_BASE}"
              export NX_BASE
            fi
          fi
          if [ -z "${NX_BASE:-}" ]; then
            echo "::warning::NX_BASE could not be determined; falling back to nx run-many"
            NX_SUBCMD="run-many"
          fi
        fi

        set +e
        npx nx "$NX_SUBCMD" -t scan \
          --parallel="$MAX_WORKERS" \
          --output-style=stream \
          2>&1 | tee /tmp/nx-scan.log
        NX_EXIT=${PIPESTATUS[0]}
        set -e

# Flush workflow-command annotations to stdout. Nx prefixes
        # every line of worker output with ANSI-coloured
        # "project-name:" + TTY reset, which GitHub's
        # workflow-command parser can't strip — so ::error file=…
        # lines emitted by the executor never reach the check-run's
        # annotations API. The executor writes the raw lines to a
        # shared file; we cat it here so the runner sees clean lines.
        if [ -s /tmp/nx-skillspector-annotations.log ]; then
          cat /tmp/nx-skillspector-annotations.log
        fi

        # Aggregate counts from the executor's annotations. Use awk
        # instead of grep so 0 matches exits 0 (grep would exit 1 and
        # fail the workflow under `set -eo pipefail`). Use exact
        # key=value matching (split on '=' and compare key) so plain
        # prose like "12 findings" doesn't match — only the structured
        # `findings=N` lines the executor emits.
        TOTAL=$(awk '{for(i=1;i<=NF;i++) if(split($i,a,"=")==2 && a[1]=="findings") s+=a[2]} END {print s+0}' /tmp/nx-scan.log)
        ERRORS=$(awk '{for(i=1;i<=NF;i++) if(split($i,a,"=")==2 && a[1]=="errors") s+=a[2]} END {print s+0}' /tmp/nx-scan.log)
        WARNINGS=$(awk '{for(i=1;i<=NF;i++) if(split($i,a,"=")==2 && a[1]=="warnings") s+=a[2]} END {print s+0}' /tmp/nx-scan.log)

        {
          echo "error-count=${ERRORS}"
          echo "warning-count=${WARNINGS}"
          echo "total-count=${TOTAL}"
          if [ -n "${{ inputs.sarif }}" ]; then
            echo "sarif-path=${{ inputs.sarif }}"
          fi
        } >> "$GITHUB_OUTPUT"

        # Merge per-skill SARIF files into a single SARIF.
        # Each executor invocation writes to <sarif>-<skill>.sarif so
        # parallel invocations don't race on a single file. The merging
        # happens here, in the host workspace (cwd), where the executor
        # wrote them.
        if [ -n "${{ inputs.sarif }}" ]; then
          SARIF_FINAL="${{ inputs.sarif }}"
          SARIF_DIR=$(dirname "$SARIF_FINAL")
          SARIF_BASE=$(basename "$SARIF_FINAL" .sarif)
          node -e '
            const fs = require("node:fs"), path = require("node:path");
            const [out, dir, base] = process.argv.slice(1);
            const files = fs.readdirSync(dir).filter(f => f.startsWith(base + "-") && f.endsWith(".sarif"));
            const merged = { $schema: "https://json.schemastore.org/sarif-2.1.0.json", version: "2.1.0", runs: [] };
            for (const f of files.sort()) {
              try {
                const s = JSON.parse(fs.readFileSync(path.join(dir, f), "utf8"));
                if (Array.isArray(s.runs)) merged.runs.push(...s.runs);
              } catch {}
            }
            fs.mkdirSync(path.dirname(out), { recursive: true });
            fs.writeFileSync(out, JSON.stringify(merged, null, 2) + "\n");
            console.log(`Merged ${files.length} per-skill SARIF files into ${out} (${merged.runs.length} runs)`);
          ' "$SARIF_FINAL" "$SARIF_DIR" "$SARIF_BASE"
        fi

        rm -f /tmp/nx-scan.log
        exit $NX_EXIT

    # Save the Nx cache after the scan. Always-on so failed runs
    # still save the partial cache (Nx keeps what it produced).
    # Using the same primary key the restore step resolved ensures
    # we update the cache entry instead of racing on a new key.
    - name: Save Nx cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: .nx/cache
        key: ${{ steps.nx-cache.outputs.cache-primary-key }}
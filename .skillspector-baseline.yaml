# SkillSpector baseline — suppress known/accepted findings.
# Generated manually for ThePlenkov/skills initial setup.
#
# These are intentional patterns in personal agent skills that are NOT
# security issues in this context. Re-run `skillspector baseline` after
# triaging new findings to keep this file up to date.
#
# Rules reference: https://github.com/NVIDIA/skillspector
#
# Format: glob rules by rule_id, file path, or message.
# See: https://github.com/NVIDIA/skillspector/blob/main/docs/SUPPRESSION.md

rules:
  # token-rationalism: "never ask", "always" directives are intentional
  # cognitive guidelines for the agent, not safety bypasses.
  - rule_id: AR1
    path: "*"
    reason: "Intentional agent autonomy instructions"

  - rule_id: AR2
    path: "*"
    reason: "Intentional agent behavior shaping"

  # safeguard skill documents safety patterns to DETECT them — not exploit them.
  - rule_id: "P[1-5]"
    path: "*"
    reason: "Skill documents prompt injection patterns for detection purposes"

  - rule_id: AR3
    path: "*"
    reason: "Skill documents jailbreak patterns for detection purposes"

  # subagent-capsule: autonomous decision-making is the explicit design goal.
  - rule_id: EA2
    path: "*"
    reason: "Autonomous subagent orchestration is the intended behavior"

  # sandbox skill describes isolation — legitimate use of permission language.
  - rule_id: PE1
    path: "*"
    reason: "Permission discussion is the topic of the skill, not a request"

  - rule_id: EA1
    path: "*"
    reason: "Tool access discussion is the topic of the skill"

  # ── Global suppressions (all skills) ──────────────────────────────
  # Finding paths are relative to the skill directory (e.g. SKILL.md),
  # NOT repo-relative, so path patterns use * not .agents/skills/**.

  # RP1 (72 findings): npx/uvx commands in skill documentation.
  # These are example commands shown to users — pinning versions would
  # make docs stale on every release. The risk is minimal because these
  # are instructions, not executed production code.
  - rule_id: RP1
    path: "*"
    reason: "Skill documentation shows example npx/uvx commands; version pinning would make docs stale"

  # EA2 (11 findings): autonomous agent decisions.
  # Agent skills are designed to operate autonomously — this is the
  # explicit design goal, not an oversight.
  - rule_id: EA2
    path: "*"
    reason: "Autonomous agent decision-making is the intended design of all skills"

  # AS3 (8 findings): skills reading other skills' files.
  # Meta-skills (dotagents, skills, claude-skills, git-*) need to
  # enumerate installed skills for management, installation, and
  # validation purposes.
  - rule_id: AS3
    path: "*"
    reason: "Meta-skills read other skills for installation, management, and validation"

  # MP2 (6 findings): false positives from markdown table delimiters
  # (|---|) and ASCII art box-drawing characters (│).
  # These are documentation formatting, not context-stuffing attempts.
  - rule_id: MP2
    path: "*"
    reason: "Markdown table delimiters and ASCII art trigger repeated-pattern regex (false positive)"

  # LP3 (5 findings): skills without declared permissions.
  # Skills that operate within the agent's existing permission scope
  # do not need explicit permission declarations.
  - rule_id: LP3
    path: "*"
    reason: "Skills operate within the agent's existing permission scope"

  # PE2 (3 findings): sudo in ci-local skill.
  # Legitimate CI/CD operations that require elevated privileges for
  # system package installation and build processes.
  - rule_id: PE2
    path: "*"
    reason: "CI/CD scripts legitimately need elevated privileges for system package management"

  # E1 (1 finding): external URL in codacy skill.
  # The Codacy skill sends analysis results to the Codacy API as part
  # of its core functionality — this is the intended behavior.
  - rule_id: E1
    path: "*"
    reason: "Codacy skill sends analysis to the Codacy API as its core function"

  # TM3 (1 finding): unsafe tool defaults in harvest skill.
  # The harvest CLI flag behavior is documented; the unsafe default
  # is a known trade-off explained in the skill docs.
  - rule_id: TM3
    path: "*"
    reason: "CLI flag defaults are documented trade-offs, not security oversights"

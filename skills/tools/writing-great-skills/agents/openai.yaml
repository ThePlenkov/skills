interface:
  display_name: "Writing Great Skills"
  short_description: "Principles for predictable skills"
  default_prompt: >-
    Apply the craft principles for writing skills that fire predictably.
    Decide whether the skill is model-invoked or user-invoked, front-load the
    leading word in the description, place steps vs. reference on the
    information hierarchy, push deep material behind context pointers, and
    prune for no-ops, duplication, and negation. Treat every section as
    reference consulted on demand, not a sequence to race through.
policy:
  allow_implicit_invocation: true

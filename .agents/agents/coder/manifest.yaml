agent: coder
notes: |
  Autonomous producer. Default-stack for code work that may end in a
  "done" claim. Heavy on evidence/investigation/rigor; explicit on
  git/version-control tools and safety/patching primitives.
required:
  - token-rationalism
  - evidence
  - investigate-first
  - minimal-root-cause
  - minimalist
  - codehome
  - one-shot-patch
  - safeguard
  - git-commit
  - git-push
  - git-reset
  - ci-local
optional:
  - persistent-memory
  - sandboxed
  - subagent-capsule
  - retrospect
  - npm-publish
  - docker-agent-config
  - e2e
  - shared-plan
forbidden:
  - act
  - harvest
  - github-pr-review
  - mr-address-review
  - triage-issue

agent: reviewer
notes: |
  Read-only review role. Applies REVIEW.md through $skill{review-methodology}
  and independent axis investigations, then merges and deduplicates
  evidence-backed findings.
required:
  - token-rationalism
  - review-methodology
  - two-axis-review
  - evidence
  - critical-thinking
  - minimalist
  - subagent-capsule
  - security-and-hardening
  - architecture-review
  - shared-plan
optional:
  - harvest
  - retrospect
  - investigate-first
  - drill
forbidden:
  - one-shot-patch
  - refactoring
  - git-workflow-and-versioning
  - git-reset
  - act
  - github-fix-main
  - triage-issue

name: CI

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'bin/**'
      - '.github/workflows/ci.yml'
      - '.github/scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'skills-lock.json'
      - 'tsconfig.json'
      - '.markdownlint.json'
      - '**/*.sh'
      - '**/*.md'
      - 'tools/**'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'bin/**'
      - '.github/workflows/ci.yml'
      - '.github/scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'skills-lock.json'
      - 'tsconfig.json'
      - '.markdownlint.json'
      - '**/*.sh'
      - '**/*.md'
      - 'tools/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: [self-hosted]
    env:
      SC_VERSION: v0.10.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache ShellCheck binary
        id: shellcheck-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/shellcheck
          key: shellcheck-${{ env.SC_VERSION }}

      - name: Install ShellCheck
        run: |
          set -euo pipefail
          if [ -x ~/.local/bin/shellcheck ] && \
             ~/.local/bin/shellcheck --version 2>/dev/null | grep -Fqx "version: ${SC_VERSION#v}"; then
            ~/.local/bin/shellcheck --version
            exit 0
          fi
          mkdir -p /tmp/shellcheck
          curl -fsSL \
            "https://github.com/koalaman/shellcheck/releases/download/${SC_VERSION}/shellcheck-${SC_VERSION}.linux.x86_64.tar.xz" \
            -o /tmp/shellcheck.tar.xz
          if command -v xz >/dev/null 2>&1; then
            tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          else
            python3 -m tarfile -e /tmp/shellcheck.tar.xz /tmp
          fi
          mkdir -p ~/.local/bin
          mv "/tmp/shellcheck-${SC_VERSION}/shellcheck" ~/.local/bin/shellcheck
          chmod +x ~/.local/bin/shellcheck
          ~/.local/bin/shellcheck --version

      - name: Add ~/.local/bin to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run ShellCheck
        run: |
          set -o pipefail
          find scripts -type f -name '*.sh' -print0 \
            | xargs -0 shellcheck --severity=warning \
            | tee shellcheck.log \
            | .github/scripts/to-annotations.sh shellcheck

  wrapper-regression:
    name: Wrapper smoke test
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true
          cache: npm

      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Set up Python
        uses: ./.github/actions/setup-python-with-fallback

      - name: Build local compiler package
        run: npx tsc -p tools/compiler/tsconfig.json

      - name: Typecheck
        run: npm run typecheck

      - name: Wrapper --help exits 0
        run: ./bin/skills.js --help

      - name: Wrapper --project is idempotent on re-run
        run: |
          set -euo pipefail
          TESTDIR=$(mktemp -d)
          cd "$TESTDIR"
          "$GITHUB_WORKSPACE/bin/skills.js" --project
          "$GITHUB_WORKSPACE/bin/skills.js" --project
          "$GITHUB_WORKSPACE/bin/skills.js" --project --check

  unit-tests:
    if: github.event_name == 'pull_request'
    name: Unit tests (self-hosted)
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        env:
          BUN_VERSION: "1.3.12"
        run: |
          set -euo pipefail
          if [ -x ~/.local/bin/bun ] && ~/.local/bin/bun --version 2>/dev/null | grep -Fqx "$BUN_VERSION"; then
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            ~/.local/bin/bun --version
            exit 0
          fi
          mkdir -p ~/.local/bin /tmp/bun
          curl -fsSL "https://github.com/oven-sh/bun/releases/download/bun-v${BUN_VERSION}/bun-linux-x64.zip" -o /tmp/bun/bun.zip
          if command -v unzip >/dev/null 2>&1; then
            unzip -q /tmp/bun/bun.zip -d /tmp/bun
          else
            python3 -m zipfile -e /tmp/bun/bun.zip /tmp/bun
          fi
          mv "/tmp/bun/bun-linux-x64/bun" ~/.local/bin/bun
          chmod +x ~/.local/bin/bun
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          bun --version

      - name: Run unit tests
        run: bun test scripts/lib/

  cross-platform-unit-tests:
    if: github.event_name == 'push'
    name: Cross-platform unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461
        with:
          bun-version: 1.3.12

      - name: Run unit tests
        run: bun test scripts/lib/

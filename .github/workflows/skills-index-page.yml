name: Skills Index Page

on:
  push:
    branches: [main]
    paths:
      - 'skills/**/SKILL.md'
      - 'scripts/generate-skills-index-md.ts'
      - '.github/workflows/skills-index-page.yml'
  workflow_dispatch:

concurrency:
  group: skills-index-page
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    name: Update docs/skills-index.md
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Generate skills index page
        run: npm run generate:skills-index-md

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/skills-index.md
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m "chore: update skills index page [skip ci]"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

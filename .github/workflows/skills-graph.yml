name: Skills Graph

on:
  push:
    branches: [main]
    paths:
      - 'skills/**/SKILL.md'
      - 'scripts/generate-skills-graph.ts'
      - 'scripts/generate-skills-graph.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/skills-graph.yml'
  pull_request:
    branches: [main]
    paths:
      - 'skills/**/SKILL.md'
      - 'scripts/generate-skills-graph.ts'
      - 'scripts/generate-skills-graph.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/skills-graph.yml'
  workflow_dispatch:

# Cancel duplicate runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regenerate:
    name: Regenerate and check skill graphs
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate graphs
        run: npm run graph

      - name: Upload generated graphs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skills-graph
          path: |
            docs/graphs/generated/
            .build/skills-graph.json
          retention-days: 7
          if-no-files-found: warn

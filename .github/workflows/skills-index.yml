name: Skills Index

on:
  push:
    branches: [main]
    paths:
      - 'skills/**/SKILL.md'
      - 'scripts/generate-skills-index.ts'
      - 'scripts/validate-skills-index.sh'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/skills-index.yml'
  pull_request:
    branches: [main]
    paths:
      - 'skills/**/SKILL.md'
      - 'scripts/generate-skills-index.ts'
      - 'scripts/validate-skills-index.sh'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/skills-index.yml'
  workflow_dispatch:

# Cancel duplicate runs on the same ref. Without this, a single push
# to a PR branch can fire the workflow twice (once for the push event
# from the underlying git push, once for the pull_request event from
# GitHub's PR machinery).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate skills-index.json
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Node dependencies
        run: npm ci

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Validate and generate index
        run: scripts/validate-skills-index.sh --update

      - name: Prepare public folder
        run: |
          mkdir -p public
          cp .claude-plugin/skills-index.json public/skills-index.json
          cp .claude-plugin/skills-index.schema.json public/skills-index.schema.json

      - name: Upload skills-index artifact
        uses: actions/upload-artifact@v7
        with:
          name: skills-index
          path: public/
          retention-days: 30
          if-no-files-found: error

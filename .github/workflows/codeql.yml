name: CodeQL

# Replaces GitHub's default-setup dynamic CodeQL workflow.
# Path filters skip CodeQL entirely when only markdown/docs change —
# the biggest win for a skills repo where most PRs touch only .md files.
on:
  push:
    branches: [main]
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.py'
      - '.github/workflows/codeql.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tools/**'
      - 'scripts/**'
      - 'bin/**'
  pull_request:
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.py'
      - '.github/workflows/codeql.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tools/**'
      - 'scripts/**'
      - 'bin/**'
  schedule:
    - cron: '0 4 * * 1'  # weekly full scan on Monday 4am UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: [self-hosted]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Use security-extended for deeper analysis on push/schedule,
          # default suite on PRs for speed.
          queries: ${{ github.event_name == 'pull_request' && 'security-and-quality' || 'security-extended' }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'

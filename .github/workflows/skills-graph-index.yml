name: Skills Graph & Index

on:
  push:
    branches: [main]
    paths:
      - 'skills/**/SKILL.md'
      - 'scripts/generate-skills-graph.ts'
      - 'scripts/generate-skills-graph.test.ts'
      - 'scripts/generate-skills-index.ts'
      - 'scripts/validate-skills-index.sh'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/skills-graph-index.yml'
  pull_request:
    branches: [main]
    paths:
      - 'skills/**/SKILL.md'
      - 'scripts/generate-skills-graph.ts'
      - 'scripts/generate-skills-graph.test.ts'
      - 'scripts/generate-skills-index.ts'
      - 'scripts/validate-skills-index.sh'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/skills-graph-index.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate:
    name: Regenerate graphs + index
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate skill graphs
        run: npm run graph

      - name: Validate and generate skills index
        run: npm run validate:update

      - name: Prepare public folder
        run: |
          mkdir -p public
          cp .claude-plugin/skills-index.json public/skills-index.json
          cp .claude-plugin/skills-index.schema.json public/skills-index.schema.json

      - name: Upload skills-graph artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skills-graph
          path: |
            docs/graphs/generated/
            .build/skills-graph.json
          retention-days: 7
          if-no-files-found: warn

      - name: Upload skills-index artifact
        uses: actions/upload-artifact@v7
        with:
          name: skills-index
          path: public/
          retention-days: 30
          if-no-files-found: error

name: Sync skills to skills-sync

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'skills.config.ts'
      - 'public-skills.config.ts'
      - 'skills-lock.json'
      - 'bin/**'
      - 'scripts/**'
      - '.github/workflows/skills-sync.yml'
  workflow_dispatch:

concurrency:
  group: skills-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    if: "github.ref == 'refs/heads/main'"
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SKILLS_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SKILLS_SYNC_APP_PRIVATE_KEY }}
          owner: theplenkov-ai
          repositories: skills,skills-sync
          permission-contents: write

      - name: Checkout source skills
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Checkout skills-sync
        uses: actions/checkout@v7
        with:
          repository: theplenkov-ai/skills-sync
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: skills-sync
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true

      - name: Remove external skill directories for refresh
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const lockFile = 'skills-lock.json';
          if (!fs.existsSync(lockFile)) {
            console.log('No skills-lock.json found; nothing to refresh.');
            process.exit(0);
          }
          const lock = JSON.parse(fs.readFileSync(lockFile, 'utf8'));
          const skills = lock.skills || {};
          const root = path.resolve('skills-sync', '.agents', 'skills');
          for (const [name, entry] of Object.entries(skills)) {
            if (entry && (entry.sourceType === 'github' || entry.sourceType === 'node_modules')) {
              if (!name || name === '.' || name === '..' || name !== path.basename(name) || name.includes('/') || name.includes('\\')) {
                throw new Error(`Invalid external skill name: ${name}`);
              }
              const expectedDir = path.join(root, name);
              const resolvedDir = path.resolve(expectedDir);
              if (!resolvedDir.startsWith(root + path.sep)) {
                throw new Error(`Resolved path escapes target root: ${resolvedDir}`);
              }
              if (fs.existsSync(expectedDir)) {
                console.log(`Removing external skill for refresh: ${name}`);
                fs.rmSync(expectedDir, { recursive: true, force: true });
              }
            }
          }
          NODE

      - name: Install jq
        run: |
          set -euo pipefail
          which jq || (sudo apt-get update -qq && sudo apt-get install -y -qq jq)

      - name: Install Node dependencies
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund --prefer-offline

      - name: Install skills into skills-sync
        run: |
          set -euo pipefail
          ./bin/skills.js --target=skills-sync/.agents/skills --force

      - name: Normalize SKILL.md frontmatter for skills-sync
        run: |
          set -euo pipefail
          node --experimental-strip-types --no-warnings scripts/write-skills-sync-frontmatter.ts --source skills-sync/.agents/skills

      - name: Generate skill dependency graphs
        run: |
          set -euo pipefail
          npm run graph

      - name: Generate skills index and validate it
        run: |
          set -euo pipefail
          npm run validate:update

      - name: Copy distribution artifacts into skills-sync
        run: |
          set -euo pipefail
          # Mermaid per-skill graphs + gallery index
          mkdir -p skills-sync/graphs
          cp -r docs/graphs/generated/* skills-sync/graphs/
          # Claude Code plugin manifest, marketplace catalog, and generated index
          mkdir -p skills-sync/.claude-plugin
          cp .claude-plugin/plugin.json skills-sync/.claude-plugin/plugin.json
          cp .claude-plugin/marketplace.json skills-sync/.claude-plugin/marketplace.json
          cp .claude-plugin/skills-index.json skills-sync/.claude-plugin/skills-index.json
          cp .claude-plugin/skills-index.schema.json skills-sync/.claude-plugin/skills-index.schema.json
          # Codex / ChatGPT plugin manifest and marketplace catalog
          mkdir -p skills-sync/.codex-plugin skills-sync/.agents/plugins
          cp .codex-plugin/plugin.json skills-sync/.codex-plugin/plugin.json
          cp .agents/plugins/marketplace.json skills-sync/.agents/plugins/marketplace.json

      - name: Verify external skills re-materialised
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const lockFile = 'skills-lock.json';
          if (!fs.existsSync(lockFile)) {
            console.log('No skills-lock.json found; no external skills to verify.');
            process.exit(0);
          }
          const lock = JSON.parse(fs.readFileSync(lockFile, 'utf8'));
          const skills = lock.skills || {};
          const root = path.resolve('skills-sync', '.agents', 'skills');
          let missing = false;
          for (const [name, entry] of Object.entries(skills)) {
            if (entry && (entry.sourceType === 'github' || entry.sourceType === 'node_modules')) {
              if (!name || name === '.' || name === '..' || name !== path.basename(name) || name.includes('/') || name.includes('\\')) {
                throw new Error(`Invalid external skill name: ${name}`);
              }
              const expectedDir = path.join(root, name);
              const skillMd = path.join(expectedDir, 'SKILL.md');
              const resolvedSkillMd = path.resolve(skillMd);
              if (!resolvedSkillMd.startsWith(expectedDir + path.sep)) {
                throw new Error(`Resolved path escapes target root: ${resolvedSkillMd}`);
              }
              if (!fs.existsSync(skillMd)) {
                console.error(`Missing expected external skill after sync: ${name}`);
                missing = true;
              }
            }
          }
          if (missing) {
            console.error('External skill reinstall failed; aborting so the mirror is not updated.');
            process.exit(1);
          }
          console.log('All external skills present.');
          NODE

      - name: Remove installer managed markers from mirror
        run: |
          set -euo pipefail
          find skills-sync/.agents/skills -type f -name '.skills-managed-by-install-sh' -delete

      - name: Build Obsidian vault in skills-sync
        run: |
          set -euo pipefail
          node --experimental-strip-types --no-warnings scripts/obsidian-vault.ts --source skills-sync/.agents/skills --out skills-sync/obsidian --clean

      - name: Build skills index README in skills-sync
        run: |
          set -euo pipefail
          node --experimental-strip-types --no-warnings scripts/skills-sync-readme.ts \
            --source skills-sync/.agents/skills \
            --skills-root skills \
            --out skills-sync/README.md \
            --vault-prefix obsidian/

      - name: Build skills index page in skills-sync
        run: |
          set -euo pipefail
          npx tsx scripts/generate-skills-index-md.ts --output skills-sync/docs/skills-index.md

      - name: Commit and push updates
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          cd skills-sync
          git add .agents/skills .agents/plugins .claude-plugin .codex-plugin graphs obsidian README.md docs/skills-index.md
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m "chore: sync skills from ${{ github.repository }}@${{ github.sha }}"
          git push https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/theplenkov-ai/skills-sync.git HEAD:main

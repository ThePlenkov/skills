name: Validate Skills

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - '.claude-plugin/marketplace.json'
      - 'package.json'
      - '.github/skill-schema.json'
      - '.github/agent-manifest-schema.json'
      - '.github/openai-metadata-schema.json'
      - '.github/workflows/validate-skills.yml'
      - '.github/scripts/**'
      - '.agents/agents/**/manifest.yaml'
      - 'scripts/validate-agent-manifests.sh'
      - 'scripts/validate-openai-metadata.sh'
      - 'scripts/validate-skill.ts'
      - 'scripts/check-tier-0-budget.cjs'
      - 'scripts/check-readme-categories.ts'
      - 'scripts/generate-coverage-matrix.ts'
      - 'scripts/check-os-independence.ts'
      - 'scripts/check-skill-size.ts'
      - 'skills/**'
      - 'skills.config.ts'
      - 'docs/skill-coverage-matrix.md'
  pull_request:
    paths:
      - 'README.md'
      - '.claude-plugin/marketplace.json'
      - 'package.json'
      - '.github/skill-schema.json'
      - '.github/agent-manifest-schema.json'
      - '.github/openai-metadata-schema.json'
      - '.github/workflows/validate-skills.yml'
      - '.github/scripts/**'
      - '.agents/agents/**/manifest.yaml'
      - 'scripts/validate-agent-manifests.sh'
      - 'scripts/validate-openai-metadata.sh'
      - 'scripts/validate-skill.ts'
      - 'scripts/check-tier-0-budget.cjs'
      - 'scripts/check-readme-categories.ts'
      - 'scripts/generate-coverage-matrix.ts'
      - 'scripts/check-os-independence.ts'
      - 'scripts/check-skill-size.ts'
      - 'skills/**'
      - 'skills.config.ts'
      - 'docs/skill-coverage-matrix.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-affected:
    name: Validate affected skills (Nx)
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true
          cache: npm

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Set up Python
        uses: ./.github/actions/setup-python-with-fallback

      - name: Build Nx plugin
        run: npm run build --prefix tools/nx-skill

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: ${{ github.event.pull_request.base.ref || 'main' }}
          workflow-id: validate-skills.yml

      - name: Override NX_HEAD to current PR HEAD
        # nx-set-shas uses the last successful run's HEAD, which may be
        # stale on PRs. $GITHUB_SHA on pull_request events is the merge
        # commit, not the PR branch HEAD. Use the PR head SHA directly.
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_HEAD" ]; then
            echo "NX_HEAD=$PR_HEAD" >> "$GITHUB_ENV"
          else
            echo "NX_HEAD=$GITHUB_SHA" >> "$GITHUB_ENV"
          fi

      - name: Run affected skill checks (lint, validate, os-check, size-check)
        run: |
          npx nx affected -t lint validate os-check size-check --parallel=4

      - name: Install skill symlinks
        if: success() || failure()
        run: ./node_modules/.bin/tsx scripts/run.ts scripts/install.sh

      - name: Validate agent manifests
        if: success() || failure()
        run: ./node_modules/.bin/tsx scripts/run.ts scripts/validate-agent-manifests.sh

      - name: Check Tier 0 always-on budget
        if: success() || failure()
        run: ./node_modules/.bin/tsx scripts/run.ts scripts/check-tier-0-budget.cjs

      - name: Check skill coverage matrix
        if: success() || failure()
        run: ./node_modules/.bin/tsx scripts/generate-coverage-matrix.ts --check

      - name: Check README categories
        if: success() || failure()
        run: ./node_modules/.bin/tsx scripts/run.ts scripts/check-readme-categories.ts

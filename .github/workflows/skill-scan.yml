name: SkillSpector Security Scan

on:
  # Post-merge scan: when code lands on main. The `branches:` filter
  # restricts push to main only, so PR-branch pushes (handled by the
  # pull_request event below) don't double-fire this workflow.
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'skills-lock.json'
      - '.github/workflows/skill-scan.yml'
      - 'actions/skillspector/**'
      - 'actions/skillspector-scan/**'
  # Pre-merge scan: when a PR is opened or updated. Provides inline
  # annotations on the PR Files Changed tab.
  pull_request:
    paths:
      - 'skills/**'
      - 'skills-lock.json'
      - '.github/workflows/skill-scan.yml'
      - 'actions/skillspector/**'
      - 'actions/skillspector-scan/**'
  workflow_dispatch:
    inputs:
      affected:
        description: 'Scan only affected skills (PR events only; dispatch always full-scans)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

# Cancel in-progress runs for the same workflow on the same ref. This
# prevents duplicate runs when a single commit triggers both a push
# and a pull_request event (e.g. when a PR branch is force-pushed).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  # security-events: write is required to upload SARIF to the
  # code-scanning API, which is what makes findings appear inline
  # in the PR Files tab as proper code-scanning alerts (the same
  # mechanism SonarCloud and CodeQL use). Without this permission,
  # upload-sarif fails with HTTP 403 on the security-events endpoint.
  security-events: write
  # pull-requests: write lets the workflow post a PR summary comment
  # (and update it in place across pushes). Declaring `permissions:`
  # above overrides the default token scopes, so we have to enumerate
  # this explicitly — otherwise the PR comment step gets 403 from
  # `gh api ... issues/comments/...` and silently fails.
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          check-latest: true
          cache: npm

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Set up Python
        # scripts/install.sh validates and compares symlinked skill trees
        # with Python 3 helpers; ensure it is available on self-hosted runners.
        uses: ./.github/actions/setup-python-with-fallback

      - name: Materialise .agents/skills for scanning
        run: npm run install:skills

      # PRs scan changed skills by default, but a PR that touches the
      # scanner itself or this workflow should run a full scan so the
      # tooling changes are validated against every skill.
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
        id: changes
        with:
          filters: |
            skillspector-core:
              - 'actions/skillspector-scan/**'
              - 'actions/skillspector/**'
              - '.github/workflows/skill-scan.yml'

      - name: Determine scan mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUTS_AFFECTED: ${{ inputs.affected }}
          SKILLSPECTOR_CORE_CHANGED: ${{ steps.changes.outputs.skillspector-core }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            echo "affected=false"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "affected=$INPUTS_AFFECTED"
          elif [[ "$SKILLSPECTOR_CORE_CHANGED" == "true" ]]; then
            echo "affected=false"
          else
            echo "affected=true"
          fi >> "$GITHUB_OUTPUT"

      # The action handles installation of SkillSpector, skill discovery,
      # per-skill scanning, SARIF/JSON merging, and step summary.
      # See actions/skillspector-scan/README.md for full documentation.
      - name: Run SkillSpector scan
        id: scan
        uses: ./actions/skillspector-scan
        with:
          path: ./.agents/skills/
          baseline: ${{ github.workspace }}/.skillspector-baseline.yaml
          upload-sarif: "false"
          fail-on: high
          changed-only: ${{ steps.mode.outputs.affected == 'true' && github.event_name == 'pull_request' }}

      # Upload the merged SARIF to the code-scanning API. This is
      # what makes findings appear inline in the PR Files Changed
      # tab as code-scanning alerts (yellow ⚠ for warnings, red ❌
      # for errors), same UX as SonarCloud / CodeQL.
      #
      # Requirements for this step to actually create alerts:
      # - the repo must have code-scanning enabled in settings
      #   (Settings → Code security and analysis → Code scanning),
      #   OR be public (code-scanning is on by default for public
      #   repos with GitHub Advanced Security free tier).
      # - this job must have `security-events: write` (declared above).
      #
      # On PRs from forks the upload is silently ignored (GitHub
      # blocks security-events writes from untrusted contexts). In
      # that case the workflow-command annotations still surface
      # findings in the Checks panel.
      #
      # `continue-on-error: true` because the SARIF file may be
      # empty when zero skills were scanned (e.g. nx affected reported
      # zero projects on a no-change PR); in that case upload-sarif
      # exits non-zero with "no SARIF files were found".
      - name: Upload SARIF to code-scanning
        if: ${{ always() && steps.scan.outputs.sarif != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: skillspector

      - name: Upload SARIF report
        if: ${{ always() && steps.scan.outputs.sarif != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: skillspector-sarif
          path: ${{ steps.scan.outputs.sarif }}
          retention-days: 7
          if-no-files-found: ignore

      # The action writes its own step summary with a findings table.
      # Post a compact PR comment linking to the full run.
      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINDINGS_COUNT: ${{ steps.scan.outputs.findings-count }}
          RISK_SCORE: ${{ steps.scan.outputs.risk-score }}
          RISK_SEVERITY: ${{ steps.scan.outputs.risk-severity }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TOTAL=${FINDINGS_COUNT:-0}
          SCORE=${RISK_SCORE:-0}
          SEV=${RISK_SEVERITY:-none}

          if [ "$TOTAL" -eq 0 ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            PREV=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq '.[] | select(.body | test("<!-- SkillSpector:tag -->")) | .id' | head -1 || true)
            [ -n "$PREV" ] && gh api -X DELETE \
              "repos/${{ github.repository }}/issues/comments/${PREV}" >/dev/null 2>&1 || true
            exit 0
          fi

          if [ "$SEV" = "high" ] || [ "$SEV" = "critical" ]; then
            ICON="❌"
          else
            ICON="✅"
          fi

          BODY="${ICON} **SkillSpector:** ${TOTAL} findings (risk ${SCORE}/100, \`${SEV}\`) — [full report →](${RUN_URL})"
          MARKER="<!-- SkillSpector:tag -->"

          PR_NUMBER="${{ github.event.pull_request.number }}"
          PREV=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq ".[] | select(.body | test(\"${MARKER}\")) | .id" | head -1 || true)

          if [ -n "$PREV" ]; then
            gh api -X PATCH \
              "repos/${{ github.repository }}/issues/comments/${PREV}" \
              --field body="${BODY}
          ${MARKER}" >/dev/null 2>&1
          else
            gh pr comment "${PR_NUMBER}" --body "${BODY}
          ${MARKER}" >/dev/null 2>&1
          fi


name: SkillSpector Security Scan

on:
  push:
    paths:
      - '.agents/skills/**'
      - '.github/workflows/skill-scan.yml'
      - '.github/scripts/**'
  pull_request:
    paths:
      - '.agents/skills/**'
      - '.github/workflows/skill-scan.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install SkillSpector
        run: uv tool install git+https://github.com/NVIDIA/skillspector.git

      # Why per-skill (not --recursive):
      #   skillspector 2.3.7's --recursive mode is broken for non-terminal
      #   output formats. Specifically:
      #     - --format json  → emits a SUMMARY document with no per-issue
      #                        details (only per-skill finding_count)
      #     - --format sarif → emits progress text to stdout, never the
      #                         SARIF document
      #   The single-skill invocation correctly produces a full SARIF
      #   document with per-issue details. So we iterate, scan each
      #   skill individually, capture SARIF, convert to annotations.
      #
      # Why use the sarif-to-annotations skill:
      #   The conversion logic is a reusable skill at
      #   .agents/skills/sarif-to-annotations/ — any tool that emits
      #   SARIF (CodeQL, Snyk, ESLint, Semgrep, Trivy) can drop in the
      #   same `python3 ... < report.sarif` line and get the same
      #   inline annotations.
      #
      # Gate: any error-severity SARIF result fails the workflow.
      # The annotation script returns 1 in that case, which we surface
      # as the workflow's exit code.
      - name: Run per-skill SARIF scan and emit annotations
        run: |
          set -u

          BASELINE_ARGS=()
          if [ -f .skillspector-baseline.yaml ]; then
            BASELINE_ARGS=(--baseline .skillspector-baseline.yaml)
          fi

          mkdir -p /tmp/skillspector
          FAILED=0
          TOTAL_FINDINGS=0
          TOTAL_ERRORS=0

          for skill_dir in .agents/skills/*/; do
            [ -d "$skill_dir" ] || continue
            [ -f "${skill_dir}SKILL.md" ] || continue
            skill=$(basename "$skill_dir")
            sarif_path="/tmp/skillspector/${skill}.sarif"

            echo "::group::Scanning ${skill} (SARIF)"

            # Single-skill SARIF output goes to the file via --output.
            # We force the exit code into SS_EXIT and don't abort the loop.
            # Use array expansion `"${BASELINE_ARGS[@]}"` (quoted, with
            # `[@]`) to handle the empty/non-empty case correctly without
            # word-splitting risks from an unquoted string variable.
            skillspector scan "$skill_dir" \
              --no-llm \
              --format sarif \
              --output "$sarif_path" \
              "${BASELINE_ARGS[@]}" \
              || SS_EXIT=$?
            SS_EXIT="${SS_EXIT:-0}"

            # Convert SARIF → GitHub annotations. The script accepts a
            # leading progress-text prefix (skillspector sometimes emits
            # one before the actual JSON), finds the first '{' and parses
            # from there.
            if [ -s "$sarif_path" ]; then
              python3 .agents/skills/sarif-to-annotations/scripts/to-annotations.py \
                < "$sarif_path" \
                || ANN_EXIT=$?
              ANN_EXIT="${ANN_EXIT:-0}"
            else
              echo "  (no SARIF produced for $skill)"
              ANN_EXIT=0
            fi

            # Per-skill counts from the SARIF
            findings=$(jq -r '.runs // [] | [.[] | .results // [] | length] | add // 0' "$sarif_path" 2>/dev/null || echo 0)
            errors=$(jq -r '
              [.runs // [] | .[] | .results // [] | .[] | select(.level == "error")] | length
            ' "$sarif_path" 2>/dev/null || echo 0)

            echo "  findings=$findings errors=$errors exit=$SS_EXIT annotations_exit=$ANN_EXIT"

            if [ "$SS_EXIT" -ne 0 ] || [ "$ANN_EXIT" -ne 0 ] || [ "$errors" -gt 0 ]; then
              FAILED=1
            fi
            TOTAL_FINDINGS=$((TOTAL_FINDINGS + findings))
            TOTAL_ERRORS=$((TOTAL_ERRORS + errors))

            echo "::endgroup::"
          done

          echo
          echo "=== Summary ==="
          echo "Total findings across all skills: $TOTAL_FINDINGS"
          echo "Total error-severity findings:     $TOTAL_ERRORS"

          exit $FAILED

      - name: Upload SARIF reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillspector-sarif
          path: /tmp/skillspector/
          retention-days: 7
name: SkillSpector Security Scan

on:
  push:
    paths:
      - '.agents/skills/**'
  pull_request:
    paths:
      - '.agents/skills/**'

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # for SARIF upload to GitHub Security tab
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install SkillSpector
        run: uv tool install git+https://github.com/NVIDIA/skillspector.git

      - name: Run security scan (static only, SARIF)
        run: |
          skillspector scan .agents/skills/ \
            --no-llm \
            --format sarif \
            --output skillspector.sarif \
            ${{ hashFiles('.skillspector-baseline.yaml') != '' && '--baseline .skillspector-baseline.yaml' || '' }}
        continue-on-error: true  # allow SARIF upload even if scan fails

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: skillspector.sarif

      - name: Fail on HIGH/CRITICAL findings
        run: |
          BASELINE_ARG=""
          if [ -f .skillspector-baseline.yaml ]; then
            BASELINE_ARG="--baseline .skillspector-baseline.yaml"
          fi
          skillspector scan .agents/skills/ --no-llm $BASELINE_ARG

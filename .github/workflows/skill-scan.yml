name: SkillSpector Security Scan

on:
  push:
    paths:
      - '.agents/skills/**'
      - '.github/workflows/skill-scan.yml'
      - '.github/scripts/**'
  pull_request:
    paths:
      - '.agents/skills/**'
      - '.github/workflows/skill-scan.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install SkillSpector
        run: uv tool install git+https://github.com/NVIDIA/skillspector.git

      # Run scan with --format json, then:
      # 1. Pipe through to-annotations.sh so each finding becomes an inline
      #    GitHub PR annotation (the primary deliverable now that GitHub Code
      #    Scanning is gone for free-tier repos).
      # 2. Tee the raw JSON to skillspector.json for archival.
      #
      # Exit code:
      #   - skillspector exits non-zero if any HIGH/CRITICAL issue is found
      #     (when --no-llm is used). This becomes the gate for the workflow.
      #   - The annotation converter always succeeds (even when there's no
      #     output to convert), so we use PIPESTATUS[0] to gate on skillspector.
      #   - `tee` writes the JSON regardless of the gate.
      - name: Run security scan and emit annotations
        run: |
          set -o pipefail

          BASELINE_ARG=""
          if [ -f .skillspector-baseline.yaml ]; then
            BASELINE_ARG="--baseline .skillspector-baseline.yaml"
          fi

          # Two-pass: first run gets the gate exit code, second run is for the
          # annotations. We avoid running skillspector twice by capturing
          # output to a file, then converting and gating separately.
          skillspector scan .agents/skills/ \
            --recursive \
            --no-llm \
            --format json \
            --output skillspector.json \
            $BASELINE_ARG \
            || SCAN_EXIT=$?
          SCAN_EXIT="${SCAN_EXIT:-0}"

          # Convert findings to GitHub annotations.
          jq -r '.issues // [] | length' skillspector.json > /dev/null  # sanity
          .github/scripts/to-annotations.sh skillspector < skillspector.json

          exit "$SCAN_EXIT"
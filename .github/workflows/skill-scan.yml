name: SkillSpector Security Scan

on:
  push:
    paths:
      - '.agents/skills/**'
      - '.github/workflows/skill-scan.yml'
      - '.github/scripts/**'
  pull_request:
    paths:
      - '.agents/skills/**'
      - '.github/workflows/skill-scan.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install SkillSpector
        run: uv tool install git+https://github.com/NVIDIA/skillspector.git

      # SkillSpector natively emits SARIF 2.1.0 (its default format). We
      # capture the report, then run a separate skill — `sarif-to-annotations`
      # — that converts the SARIF to GitHub Actions workflow commands so
      # each finding becomes an inline PR annotation.
      #
      # The conversion is a separate concern from this workflow: the
      # `sarif-to-annotations` skill in .agents/skills/ is reusable for any
      # tool that emits SARIF (CodeQL, Snyk, ESLint, etc.).
      #
      # Exit code semantics:
      #   - SkillSpector returns 0 on success, 1 if any HIGH/CRITICAL issue
      #     is found.
      #   - The sarif-to-annotations script returns 1 if any `level: error`
      #     result is in the SARIF (i.e. HIGH/CRITICAL from SkillSpector),
      #     0 otherwise. We use its exit code to gate the workflow.
      #   - We do NOT `set -e` in this step so the annotation step always
      #     runs even if SkillSpector fails. We capture SkillSpector's exit
      #     code with `|| SS_EXIT=$?` and surface it as a workflow-failure
      #     annotation if non-zero AND no error-severity results were
      #     already reported.
      - name: Run SkillSpector and emit SARIF annotations
        run: |
          set -u

          BASELINE_ARG=""
          if [ -f .skillspector-baseline.yaml ]; then
            BASELINE_ARG="--baseline .skillspector-baseline.yaml"
          fi

          # Scan every skill in the repo. SkillSpector's --recursive flag
          # makes it discover each .agents/skills/<name>/SKILL.md. Default
          # output format is SARIF 2.1.0; we write to a file so we can both
          # convert to annotations and upload as an artifact.
          skillspector scan .agents/skills/ \
            --recursive \
            --no-llm \
            --format sarif \
            --output skillspector.sarif \
            $BASELINE_ARG \
            || SS_EXIT=$?
          SS_EXIT="${SS_EXIT:-0}"

          echo "SkillSpector exit: $SS_EXIT"
          echo "SARIF size: $(wc -c < skillspector.sarif) bytes"

          # Convert SARIF → GitHub annotations. Exit code:
          #   0 = no error-severity findings
          #   1 = one or more error-severity findings (HIGH/CRITICAL)
          #   2 = invalid input
          python3 .agents/skills/sarif-to-annotations/scripts/to-annotations.py \
            < skillspector.sarif \
            || ANN_EXIT=$?
          ANN_EXIT="${ANN_EXIT:-0}"

          # Gate on either signal: SkillSpector non-zero OR annotation
          # script reports errors. The annotation script's count is the
          # more specific signal (per-result severity), so prefer it when
          # both fire.
          if [ "$ANN_EXIT" -ne 0 ]; then
            exit "$ANN_EXIT"
          elif [ "$SS_EXIT" -ne 0 ]; then
            exit "$SS_EXIT"
          fi

      - name: Upload SARIF report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skillspector-sarif
          path: skillspector.sarif
          retention-days: 7
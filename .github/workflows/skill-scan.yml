name: SkillSpector Security Scan

on:
  # Post-merge scan: when code lands on main. The `branches:` filter
  # restricts push to main only, so PR-branch pushes (handled by the
  # pull_request event below) don't double-fire this workflow.
  push:
    branches: [main]
    paths:
      - '.agents/skills/**'
      - '.github/workflows/skill-scan.yml'
      - 'actions/skillspector/**'
  # Pre-merge scan: when a PR is opened or updated. Provides inline
  # annotations on the PR Files Changed tab.
  pull_request:
    paths:
      - '.agents/skills/**'
      - '.github/workflows/skill-scan.yml'
      - 'actions/skillspector/**'
  workflow_dispatch:
    inputs:
      full-scan:
        description: >-
          Scan every skill in `.agents/skills/` instead of only the
          `nx affected` ones. Defaults to `true` (full scan) to
          preserve the pre-existing dispatch behaviour. Set to `false`
          to restrict the scan to skills whose files changed since
          `base-branch` (saves time on large skill repos; uses
          `nx affected` under the hood).
        type: boolean
        required: false
        default: true

# Cancel in-progress runs for the same workflow on the same ref. This
# prevents duplicate runs when a single commit triggers both a push
# and a pull_request event (e.g. when a PR branch is force-pushed).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  # security-events: write is required to upload SARIF to the
  # code-scanning API, which is what makes findings appear inline
  # in the PR Files tab as proper code-scanning alerts (the same
  # mechanism SonarCloud and CodeQL use). Without this permission,
  # upload-sarif fails with HTTP 403 on the security-events endpoint.
  security-events: write
  # pull-requests: write lets the workflow post a PR summary comment
  # (and update it in place across pushes). Declaring `permissions:`
  # above overrides the default token scopes, so we have to enumerate
  # this explicitly — otherwise the PR comment step gets 403 from
  # `gh api ... issues/comments/...` and silently fails.
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The action handles installation of skillspector and per-skill
      # iteration internally. The path is auto-detected: a single
      # skill (`path/SKILL.md`) is scanned once; a parent directory
      # is iterated over its `*/SKILL.md` children.
      #
      # See actions/skillspector/README.md for the full architecture
      # rationale (JSON→SARIF translation preserving the per-issue
      # schema, dual output modes, etc.).
      - name: Run SkillSpector scan
        id: scan
        uses: ./actions/skillspector
        with:
          path: ./.agents/skills/
          # sarif: "" disables SARIF output from the action. The
          # upload-sarif step below would otherwise fail with
          # "Code scanning is not enabled for this repository"
          # because this is a private repo without code-scanning
          # on. Setting sarif to empty (= boolean off per the
          # action's input contract) makes the action skip writing
          # the file; the upload steps become no-ops via
          # `if: steps.scan.outputs.sarif-path != ''`.
          # To re-enable: set this to a path (e.g. the previous
          # ${{ github.workspace }}/skillspector.sarif) AND enable
          # code-scanning in the repo settings.
          sarif: ""
          job-summary: 'true'
          # For cascade-of-PRs setups where each PR targets the
          # previous PR's branch (not main), pass the actual base.
          # nx-set-shas uses this to compute NX_BASE for `nx affected`.
          base-branch: ${{ github.event.pull_request.base.ref || 'main' }}
          # Translate the `full-scan` workflow_dispatch input into the
          # action's `affected` input. The mapping is inverted because
          # the two inputs use opposite polarities:
          #   workflow_dispatch.inputs.full-scan = true  →  affected = false  →  `nx run-many`  (full scan)
          #   workflow_dispatch.inputs.full-scan = false →  affected = true   →  `nx affected`  (changed skills only)
          # On push / pull_request events the workflow_dispatch input is
          # empty (falsy in GHA), so the expression falls through to
          # `affected = true` (affected-only) — that is the pre-existing
          # behaviour for those triggers and is what we want.
          #
          # Implementation note: do NOT compare the boolean input to a
          # string literal (`== 'true'`). GHA coerces booleans to 1/0 and
          # non-numeric strings to NaN, so `true == 'true'` evaluates to
          # `1 == NaN` → false, breaking the inversion. The
          # `&& / ||` short-circuit form below uses GHA's actual
          # truthiness rules and works for all three input shapes.
          affected: ${{ inputs.full-scan && 'false' || 'true' }}

      # Upload the merged SARIF to the code-scanning API. This is
      # what makes findings appear inline in the PR Files Changed
      # tab as code-scanning alerts (yellow ⚠ for warnings, red ❌
      # for errors), same UX as SonarCloud / CodeQL.
      #
      # Requirements for this step to actually create alerts:
      # - the repo must have code-scanning enabled in settings
      #   (Settings → Code security and analysis → Code scanning),
      #   OR be public (code-scanning is on by default for public
      #   repos with GitHub Advanced Security free tier).
      # - this job must have `security-events: write` (declared above).
      #
      # On PRs from forks the upload is silently ignored (GitHub
      # blocks security-events writes from untrusted contexts). In
      # that case the workflow-command annotations still surface
      # findings in the Checks panel.
      #
      # `continue-on-error: true` because the SARIF file may be
      # empty when zero skills were scanned (e.g. nx affected reported
      # zero projects on a no-change PR); in that case upload-sarif
      # exits non-zero with "no SARIF files were found".
      - name: Upload SARIF to code-scanning
        # Skip when the scan didn't produce a SARIF file (see the
        # `sarif: ""` on the scan step). upload-sarif would otherwise
        # fail with "no SARIF files were found" or "Code scanning is
        # not enabled for this repository" — both are dead-code here.
        if: ${{ always() && steps.scan.outputs.sarif-path != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif-path }}
          category: skillspector

      - name: Upload SARIF report
        if: ${{ always() && steps.scan.outputs.sarif-path != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: skillspector-sarif
          path: ${{ steps.scan.outputs.sarif-path }}
          retention-days: 7
          if-no-files-found: ignore

      # The rich design lives in the workflow run summary ($GITHUB_STEP_SUMMARY),
      # NOT in the PR comment. The Actions run page renders full Markdown
      # (tables, <details>, badges) properly, while the PR conversation
      # should stay minimal. We:
      # 1. PREPEND a header to the step summary (executor appends per-skill
      #    blocks, this header caps them with totals + a status badge)
      # 2. POST a minimal one-liner PR comment that links to the run
      # Build step summary: tree-style per-skill report with finding details.
      - name: Write step summary
        if: always()
        env:
          ERROR_COUNT: ${{ steps.scan.outputs.error-count }}
          WARNING_COUNT: ${{ steps.scan.outputs.warning-count }}
          TOTAL_COUNT: ${{ steps.scan.outputs.total-count }}
          FINDINGS_DIR: /tmp/ss-findings
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ARTIFACT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
        run: |
          node .github/scripts/build-step-summary.js

      # Post a compact PR comment (Conversation tab).
      # Heavy content lives in the Actions run summary.
      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ERROR_COUNT: ${{ steps.scan.outputs.error-count }}
          WARNING_COUNT: ${{ steps.scan.outputs.warning-count }}
          TOTAL_COUNT: ${{ steps.scan.outputs.total-count }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TOTAL=${TOTAL_COUNT:-0}
          ERR=${ERROR_COUNT:-0}
          WARN=${WARNING_COUNT:-0}

          # Zero-finding case: remove prior comment.
          if [ "$TOTAL" -eq 0 ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            PREV=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments?per_page=100" \
              --jq '.[] | select(.body | test("<!-- SkillSpector:tag -->")) | .id' | head -1 || true)
            [ -n "$PREV" ] && gh api -X DELETE \
              "repos/${{ github.repository }}/issues/comments/${PREV}" >/dev/null 2>&1 || true
            exit 0
          fi

          if [ "$ERR" -gt 0 ]; then
            ICON="❌"
          else
            ICON="✅"
          fi

          BODY="${ICON} **SkillSpector:** ${TOTAL_COUNT} findings (${ERR} errors, ${WARN} warnings) — [full report →](${RUN_URL})"
          MARKER="<!-- SkillSpector:tag -->"

          PR_NUMBER="${{ github.event.pull_request.number }}"
          PREV=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq ".[] | select(.body | test(\"${MARKER}\")) | .id" | head -1 || true)

          if [ -n "$PREV" ]; then
            gh api -X PATCH \
              "repos/${{ github.repository }}/issues/comments/${PREV}" \
              --field body="${BODY}
          ${MARKER}" >/dev/null 2>&1
          else
            gh pr comment "${PR_NUMBER}" --body "${BODY}
          ${MARKER}" >/dev/null 2>&1
          fi


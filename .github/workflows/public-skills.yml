name: Public skills

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: public-skills
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  matrix:
    runs-on: [self-hosted]
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - id: matrix
        run: |
          include=$(npx tsx scripts/generate-public-skills-matrix.ts)
          echo "include<<EOF" >> "$GITHUB_OUTPUT"
          echo "$include" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  publish:
    needs: matrix
    runs-on: [self-hosted]
    if: needs.matrix.outputs.include != '{"include":[]}'
    strategy:
      matrix: ${{ fromJSON(needs.matrix.outputs.include) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SKILLS_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SKILLS_SYNC_APP_PRIVATE_KEY }}
          owner: ThePlenkov
          repositories: skills
          permission-contents: write
      - run: npx tsc -p tools/compiler/tsconfig.json
      - run: npx tsx scripts/publish-skill.ts
        env:
          SKILL: ${{ matrix.skill }}
          REPO: ${{ matrix.repo }}
          FORMAT: ${{ matrix.format }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

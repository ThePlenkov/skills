name: Public skills

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  pick-runner:
    runs-on: ubuntu-latest
    outputs:
      labels: ${{ steps.pick.outputs.labels }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          labels=$(gh api "repos/${{ github.repository }}/actions/runners" --jq '
            [((.runners // []) | .[]) | select(.status == "online") | .labels[].name | ascii_downcase] |
            if contains(["self-hosted"]) and contains(["linux"]) and contains(["x64"]) then
              "[\"self-hosted\",\"linux\",\"x64\"]"
            else
              "[\"ubuntu-latest\"]"
            end
          ')
          echo "labels=${labels}" >> "$GITHUB_OUTPUT"

  matrix:
    needs: pick-runner
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - id: matrix
        run: |
          include=$(npx tsx scripts/generate-public-skills-matrix.ts)
          echo "include<<EOF" >> "$GITHUB_OUTPUT"
          echo "$include" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  publish:
    needs: [matrix, pick-runner]
    runs-on: ${{ fromJSON(needs.pick-runner.outputs.labels) }}
    if: needs.matrix.outputs.include != '{"include":[]}'
    strategy:
      matrix: ${{ fromJSON(needs.matrix.outputs.include) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SKILLS_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.SKILLS_SYNC_APP_PRIVATE_KEY }}
          owner: ThePlenkov
          repositories: skills
          permission-contents: write
      - run: npx tsc -p tools/compiler/tsconfig.json
      - run: npx tsx scripts/publish-skill.ts
        env:
          SKILL: ${{ matrix.skill }}
          REPO: ${{ matrix.repo }}
          FORMAT: ${{ matrix.format }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
